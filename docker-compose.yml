services:
  postgres:
    image: postgres:16-alpine
    container_name: payhook-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payhook}
      POSTGRES_USER: ${POSTGRES_USER:-payhook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payhook}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-payhook} -d ${POSTGRES_DB:-payhook}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: payhook-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@payhook.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  backend:
    build:
      context: ./backend/src/Payhook.Api
      dockerfile: Dockerfile
    container_name: payhook-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-payhook};Username=${POSTGRES_USER:-payhook};Password=${POSTGRES_PASSWORD:-payhook}
    ports:
      - "${BACKEND_PORT:-5000}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
